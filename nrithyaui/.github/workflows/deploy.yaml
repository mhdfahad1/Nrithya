name: CI/CD Pipeline

on:
  push:
    branches:
      - "main"

env:
  DOCKER_IMAGE_NAME: nrithyaUI
  DOCKER_PORT: 4000

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.run_id }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Print variables
        run: |
          echo "DOCKER_IMAGE_NAME: $DOCKER_IMAGE_NAME"
          echo "DOCKER_PORT: $DOCKER_PORT"
          echo "Github repository: ${{ github.repository }}"
          echo "Github run ID: ${{ github.run_id }}"

      - name: Execute SSH commands
        uses: appleboy/ssh-action@master
        env:
          DOCKER_IMAGE_NAME: nrithyaUI
          DOCKER_PORT: 4000
        with:
          host: ${{ secrets.HOST_NAME }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DOCKER_IMAGE_NAME: $DOCKER_IMAGE_NAME"
            echo "DOCKER_PORT: $DOCKER_PORT"
            echo "Github repository: ${{ github.repository }}"
            echo "Github run ID: ${{ github.run_id }}"
            docker login --password ${{ secrets.GITHUB_TOKEN }} --username ${{ github.actor }} ghcr.io
            docker stop  nrithyaUI && docker rm  nrithyaUI || true
            docker system prune -f
            docker pull ghcr.io/${{ github.repository }}:${{ github.run_id }}
            docker run -d --name nrithyaUI --restart always -p 4000:4000 -i ghcr.io/${{ github.repository }}:${{ github.run_id }}

      - name: Cache npm and Next.js files
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
